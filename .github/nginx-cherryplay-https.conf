# Конфигурация Nginx для CherryPlay с HTTPS (Let's Encrypt).
# Используется на хосте как reverse proxy перед Docker.
#
# Перед использованием:
# 1. Замените YOUR_DOMAIN на ваш домен (например cherrypashkaparty.ru).
# 2. Установите сертификат (см. .github/DEPLOYMENT.md, раздел HTTPS).
# 3. Скопируйте на сервер и подставьте домен: sed 's/YOUR_DOMAIN/yourdomain.com/g' nginx-cherryplay-https.conf | sudo tee /etc/nginx/sites-available/cherryplay
# 4. sudo ln -sf /etc/nginx/sites-available/cherryplay /etc/nginx/sites-enabled/
# 5. sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$server_name$request_uri;
}

# HTTPS — всё приложение за одним доменом (фронт + /api + /auth + /partyHub)
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt (замените YOUR_DOMAIN на ваш домен)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
