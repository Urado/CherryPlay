name: Release and Deploy

on:
  release:
    types: [created]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Tagged Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        id: image-names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_SERVER=$REPO_LOWER/server" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME_WEB=$REPO_LOWER/web" >> $GITHUB_OUTPUT
          echo "Repository name (lowercase): $REPO_LOWER"

      - name: Extract version tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building images with version: $VERSION"

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./CherryPlayServer
          file: ./CherryPlayServer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_SERVER }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_SERVER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CherryPlayWeb/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_WEB }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save version for deployment
        id: save-version
        run: |
          echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ~/cherryplay-deploy"

      - name: Copy docker-compose.prod.yml to server
        run: |
          scp docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/cherryplay-deploy/

      - name: Copy deploy script to server
        run: |
          scp scripts/deploy.sh \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/cherryplay-deploy/

      - name: Deploy application
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CORS_ORIGIN_0: ${{ secrets.CORS_ORIGIN_0 }}
          CORS_ORIGIN_1: ${{ secrets.CORS_ORIGIN_1 }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd ~/cherryplay-deploy
            chmod +x deploy.sh
            export VERSION='${{ needs.build-and-push.outputs.version }}'
            export REGISTRY='${{ env.REGISTRY }}'
            export IMAGE_NAME_SERVER='${REPO_LOWER}/server'
            export IMAGE_NAME_WEB='${REPO_LOWER}/web'
            export GHCR_TOKEN='$GHCR_TOKEN'
            export JWT_SECRET_KEY='$JWT_SECRET_KEY'
            export POSTGRES_PASSWORD='$POSTGRES_PASSWORD'
            export CORS_ORIGIN_0='$CORS_ORIGIN_0'
            export CORS_ORIGIN_1='$CORS_ORIGIN_1'
            ./deploy.sh
          "

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful! Version ${{ needs.build-and-push.outputs.version }} is now live."
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
