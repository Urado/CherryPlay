name: Release and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag in vX.Y.Z format (e.g. v0.6.1)
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Tagged Images
    if: ${{ !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'player-')) && !(github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'player-')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        id: image-names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_SERVER=$REPO_LOWER/server" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME_WEB=$REPO_LOWER/web" >> $GITHUB_OUTPUT
          echo "Repository name (lowercase): $REPO_LOWER"

      - name: Extract version tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_TAG}"
          else
            VERSION="${RELEASE_TAG}"
          fi
          if ! [[ "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: Release tag must use vX.Y.Z format: '${VERSION}'"
            exit 1
          fi
          SERVER_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "server_version=$SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "Building images with version: $VERSION"
          echo "Server/Web compatibility version: ${SERVER_VERSION}"

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./CherryPlayServer
          file: ./CherryPlayServer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_SERVER }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_SERVER }}:latest
          build-args: |
            CLIENT_COMPATIBILITY_SERVER_VERSION=${{ steps.version.outputs.server_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CherryPlayWeb/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_WEB }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.IMAGE_NAME_WEB }}:latest
          build-args: |
            CLIENT_COMPATIBILITY_SERVER_VERSION=${{ steps.version.outputs.server_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save version for deployment
        id: save-version
        run: |
          echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-24.04
    if: ${{ !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'player-')) && !(github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'player-')) && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ~/cherryplay-deploy"

      - name: Copy docker-compose.prod.yml to server
        run: |
          scp docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/cherryplay-deploy/

      - name: Copy monitoring configuration to server
        run: |
          scp -r monitoring \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/cherryplay-deploy/

      - name: Copy deploy script to server
        run: |
          scp scripts/deploy.sh scripts/compose-env.sh \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/cherryplay-deploy/

      - name: Prepare Nginx HTTPS config with domain from CORS_ORIGIN_0
        env:
          CORS_ORIGIN_0: ${{ secrets.CORS_ORIGIN_0 }}
        run: |
          if [ -n "$CORS_ORIGIN_0" ]; then
            DOMAIN="${CORS_ORIGIN_0#*://}"
            DOMAIN="${DOMAIN%%/*}"
            DOMAIN="${DOMAIN%%:*}"
            if [ -n "$DOMAIN" ]; then
              sed "s/YOUR_DOMAIN/${DOMAIN}/g" .github/nginx-cherryplay-https.conf > nginx-cherryplay-https.conf
            else
              cp .github/nginx-cherryplay-https.conf nginx-cherryplay-https.conf
            fi
          else
            cp .github/nginx-cherryplay-https.conf nginx-cherryplay-https.conf
          fi

      - name: Copy Nginx HTTPS config to server
        run: |
          scp nginx-cherryplay-https.conf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/cherryplay-deploy/

      - name: Deploy application
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          DATABASE__AutoMigrateOnStartup: "true"
          CORS_ORIGIN_0: ${{ secrets.CORS_ORIGIN_0 }}
          CORS_ORIGIN_1: ${{ secrets.CORS_ORIGIN_1 }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          OAUTH_VK_CLIENT_ID: ${{ secrets.OAUTH_VK_CLIENT_ID }}
          OAUTH_VK_CLIENT_SECRET: ${{ secrets.OAUTH_VK_CLIENT_SECRET }}
          RUSENDER_API_TOKEN: ${{ secrets.RUSENDER_API_TOKEN }}
          RUSENDER_SEND_KEY_ID: ${{ secrets.RUSENDER_SEND_KEY_ID }}
        run: |
          set -euo pipefail
          REPO_LOWER=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          DEPLOY_ENV_FILE=$(mktemp)
          trap 'rm -f "$DEPLOY_ENV_FILE"' EXIT
          write_env_value() {
            printf '%s=%q\n' "$1" "${!1}" >> "$DEPLOY_ENV_FILE"
          }
          export IMAGE_NAME_SERVER="${REPO_LOWER}/server"
          export IMAGE_NAME_WEB="${REPO_LOWER}/web"
          write_env_value VERSION
          write_env_value REGISTRY
          write_env_value IMAGE_NAME_SERVER
          write_env_value IMAGE_NAME_WEB
          write_env_value GHCR_TOKEN
          write_env_value JWT_SECRET_KEY
          write_env_value POSTGRES_PASSWORD
          write_env_value PGADMIN_EMAIL
          write_env_value PGADMIN_PASSWORD
          write_env_value GRAFANA_ADMIN_PASSWORD
          write_env_value DATABASE__AutoMigrateOnStartup
          write_env_value CORS_ORIGIN_0
          write_env_value CORS_ORIGIN_1
          write_env_value OAUTH_VK_CLIENT_ID
          write_env_value OAUTH_VK_CLIENT_SECRET
          write_env_value RUSENDER_API_TOKEN
          write_env_value RUSENDER_SEND_KEY_ID
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -c '\''set -euo pipefail; cd ~/cherryplay-deploy; umask 077; trap "rm -f .deploy.env" EXIT; cat > .deploy.env; set -a; source .deploy.env; set +a; chmod +x deploy.sh; ./deploy.sh'\''' < "$DEPLOY_ENV_FILE"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful! Version ${{ needs.build-and-push.outputs.version }} is now live."
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
