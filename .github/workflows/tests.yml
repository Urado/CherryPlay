name: Server Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-integrationdb-changes:
    name: Detect IntegrationDb-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      should_run: ${{ steps.filter.outputs.integrationdb }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integrationdb:
              - 'CherryPlayServer/**'
              - 'CherryPlayServer.Tests/**'
              - '**/Migrations/**'
              - 'docker-compose*.yml'
              - 'CherryPlayServer/Dockerfile*'
              - '.github/workflows/tests.yml'

  fast-tests:
    name: Fast Tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CherryPlayServer.Tests/CherryPlayServer.Tests.csproj

      - name: Run fast tests
        run: dotnet test CherryPlayServer.Tests/CherryPlayServer.Tests.csproj --configuration Release --no-restore --filter "Category!=IntegrationDb" --logger "trx;LogFileName=fast-tests.trx"

      - name: Upload fast test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-tests-trx
          path: "**/fast-tests.trx"
          if-no-files-found: warn

  integrationdb-tests:
    name: IntegrationDb Tests (Postgres)
    runs-on: ubuntu-latest
    needs:
      - detect-integrationdb-changes
      - fast-tests
    if: >
      always() &&
      needs.fast-tests.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-integrationdb-changes.outputs.should_run == 'true'
      )
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHERRYPLAY_INTEGRATION_DB_ADMIN_CONNECTION_STRING: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CherryPlayServer.Tests/CherryPlayServer.Tests.csproj

      - name: Run IntegrationDb tests
        run: dotnet test CherryPlayServer.Tests/CherryPlayServer.Tests.csproj --configuration Release --no-restore --filter "Category=IntegrationDb" --logger "trx;LogFileName=integrationdb-tests.trx"

      - name: Upload IntegrationDb test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrationdb-tests-trx
          path: "**/integrationdb-tests.trx"
          if-no-files-found: warn
