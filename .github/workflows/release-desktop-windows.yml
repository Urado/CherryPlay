name: Release Desktop Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.6.1-fix-1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Windows Zip and Upload
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.draft }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            CherryPlayComponents/package-lock.json
            CherryPlayList/package-lock.json

      - name: Install and build CherryPlayComponents
        working-directory: CherryPlayComponents
        run: |
          npm ci
          npm run build

      - name: Sync package version from release tag
        working-directory: CherryPlayList
        shell: bash
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [ -z "${VERSION}" ]; then
            echo "ERROR: Release tag '${TAG_NAME}' produced an empty VERSION after stripping leading v"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: VERSION '${VERSION}' (from tag '${TAG_NAME}') is not a valid semver for npm version"
            echo "Expected form: MAJOR.MINOR.PATCH with optional -prerelease or +build metadata"
            exit 1
          fi
          echo "Syncing CherryPlayList version to ${VERSION} (from tag ${TAG_NAME})"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Install CherryPlayList dependencies
        working-directory: CherryPlayList
        run: npm ci

      - name: Build Windows zip (no AIMP staging)
        working-directory: CherryPlayList
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:ci

      - name: Locate and upload release asset
        working-directory: CherryPlayList
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          shopt -s nullglob
          zips=(release/CherryPlayList-*-x64.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: No CherryPlayList-*-x64.zip found under release/"
            ls -la release/ || true
            exit 1
          fi
          if [ ${#zips[@]} -gt 1 ]; then
            echo "ERROR: Multiple matching zips found:"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          ZIP="${zips[0]}"
          echo "Uploading ${ZIP} to release ${TAG_NAME}"
          gh release upload "${TAG_NAME}" "${ZIP}" --clobber
