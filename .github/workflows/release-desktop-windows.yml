name: Release Desktop Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Destination GitHub Release tag to attach the zip (e.g. v0.6.1). Build uses the selected branch; zip version comes from CherryPlayList/package.json.
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Windows Zip and Upload
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.draft }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            CherryPlayComponents/package-lock.json
            CherryPlayList/package-lock.json

      - name: Install and build CherryPlayComponents
        working-directory: CherryPlayComponents
        run: |
          npm ci
          npm run build

      - name: Install CherryPlayList dependencies
        working-directory: CherryPlayList
        run: npm ci

      - name: Build Windows zip (no AIMP staging)
        working-directory: CherryPlayList
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:ci

      - name: Locate and upload release asset
        working-directory: CherryPlayList
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "undefined" ] || ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: CherryPlayList/package.json version is missing or invalid: '${VERSION}'"
            exit 1
          fi
          if [ -z "${TAG_NAME}" ]; then
            echo "ERROR: Release tag is empty"
            exit 1
          fi
          ZIP="release/CherryPlayList-${VERSION}-x64.zip"
          if [ ! -f "${ZIP}" ]; then
            echo "ERROR: Expected zip not found: ${ZIP}"
            ls -la release/ || true
            exit 1
          fi
          echo "App version (from CherryPlayList/package.json): ${VERSION}"
          echo "Destination GitHub Release tag: ${TAG_NAME}"
          echo "Uploading ${ZIP} to release ${TAG_NAME}"
          gh release upload "${TAG_NAME}" "${ZIP}" --clobber
