name: Release Desktop Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Destination GitHub Release tag to attach the zip. player-vX.Y.Z tags also set the Desktop version; other tags use CherryPlayList/package.json.
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Windows Zip and Upload
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.draft }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            eslint-config-cherryplay/package-lock.json
            CherryPlayComponents/package-lock.json
            CherryPlayList/package-lock.json

      - name: Install shared ESLint config dependencies
        working-directory: eslint-config-cherryplay
        run: npm ci

      - name: Install and build CherryPlayComponents
        working-directory: CherryPlayComponents
        run: |
          npm ci
          npm run build

      - name: Install CherryPlayList dependencies
        working-directory: CherryPlayList
        run: npm ci

      - name: Resolve Desktop version
        id: app-version
        working-directory: CherryPlayList
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
        shell: bash
        run: |
          IS_PRERELEASE="${RELEASE_PRERELEASE}"
          IS_DRAFT="${RELEASE_DRAFT}"
          if [[ "${EVENT_NAME}" == workflow_dispatch && "${TAG_NAME}" == player-* ]]; then
            RELEASE_STATE="$(gh release view "${TAG_NAME}" --json isPrerelease,isDraft --jq '[.isPrerelease, .isDraft] | @tsv')"
            IFS=$'\t' read -r IS_PRERELEASE IS_DRAFT <<< "${RELEASE_STATE}"
          fi
          VERSION="$(EVENT_NAME="${EVENT_NAME}" TAG_NAME="${TAG_NAME}" IS_PRERELEASE="${IS_PRERELEASE}" IS_DRAFT="${IS_DRAFT}" node scripts/resolveDesktopReleaseVersion.mjs package.json package-lock.json)"
          echo "Desktop version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate release workflow contracts
        run: node --test CherryPlayList/tests/releaseWorkflowContract.test.mjs

      - name: Build Windows zip with committed AIMP bridge
        working-directory: CherryPlayList
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:ci

      - name: Verify AIMP bridge in Windows zip
        shell: pwsh
        env:
          VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          $zipPath = "CherryPlayList/release/CherryPashkaParty-$env:VERSION-x64.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Expected Windows zip not found: $zipPath"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entryNames = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            $requiredSuffixes = @(
              'CherryPlayAimpBridge/CherryPlayAimpBridge.dll',
              'CherryPlayAimpBridge/manifest.json'
            )
            foreach ($suffix in $requiredSuffixes) {
              if (-not ($entryNames | Where-Object { $_.EndsWith($suffix, [System.StringComparison]::OrdinalIgnoreCase) })) {
                throw "Windows zip is missing packaged AIMP file ending in '$suffix'."
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Locate and upload release asset
        working-directory: CherryPlayList
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
          VERSION: ${{ steps.app-version.outputs.version }}
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "undefined" ] || [ "${PACKAGE_VERSION}" != "${VERSION}" ]; then
            echo "ERROR: Built package version '${PACKAGE_VERSION}' does not match resolved version '${VERSION}'"
            exit 1
          fi
          if [ -z "${TAG_NAME}" ]; then
            echo "ERROR: Release tag is empty"
            exit 1
          fi
          ZIP="release/CherryPashkaParty-${VERSION}-x64.zip"
          if [ ! -f "${ZIP}" ]; then
            echo "ERROR: Expected zip not found: ${ZIP}"
            ls -la release/ || true
            exit 1
          fi
          echo "App version: ${VERSION}"
          echo "Destination GitHub Release tag: ${TAG_NAME}"
          echo "Uploading ${ZIP} to release ${TAG_NAME}"
          gh release upload "${TAG_NAME}" "${ZIP}" --clobber
