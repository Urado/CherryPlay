name: Verify Desktop Windows

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'CherryPlayList/**'
      - 'CherryPlayComponents/**'
      - '.github/workflows/verify-desktop-windows.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-desktop-windows:
    name: Verify Desktop Windows Zip
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            CherryPlayComponents/package-lock.json
            CherryPlayList/package-lock.json

      - name: Install and build CherryPlayComponents
        working-directory: CherryPlayComponents
        run: |
          npm ci
          npm run build

      - name: Install CherryPlayList dependencies
        working-directory: CherryPlayList
        run: npm ci

      - name: Build Windows zip (no AIMP staging)
        working-directory: CherryPlayList
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:ci

      - name: Locate Windows zip
        id: locate-zip
        working-directory: CherryPlayList
        shell: bash
        run: |
          shopt -s nullglob
          zips=(release/CherryPlayList-*-x64.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ERROR: No CherryPlayList-*-x64.zip found under release/"
            ls -la release/ || true
            exit 1
          fi
          if [ ${#zips[@]} -gt 1 ]; then
            echo "ERROR: Multiple matching zips found:"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          ZIP="${zips[0]}"
          ZIP_NAME="$(basename "${ZIP}")"
          echo "Found ${ZIP}"
          echo "zip_path=CherryPlayList/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherryplaylist-win-x64
          path: ${{ steps.locate-zip.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Comment download link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const zipName = '${{ steps.locate-zip.outputs.zip_name }}';
            const marker = '<!-- cherryplaylist-desktop-pr-artifact -->';
            const body = [
              marker,
              '## Desktop build ready for testing',
              '',
              `Windows zip **\`${zipName}\`** is attached to this workflow run as artifact **\`cherryplaylist-win-x64\`**.`,
              '',
              `1. Open the [workflow run](${runUrl})`,
              '2. Scroll to **Artifacts**',
              '3. Download **cherryplaylist-win-x64** (zip inside)',
              '',
              '_Retention: 14 days. Same packaging path as release (`dist:win:ci`), not uploaded to GitHub Releases._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
