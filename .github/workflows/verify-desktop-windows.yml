name: Verify Desktop Windows

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'CherryPlayList/**'
      - 'CherryPlayComponents/**'
      - 'eslint-config-cherryplay/**'
      - '.github/workflows/verify-desktop-windows.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-desktop-windows:
    name: Verify Desktop Windows Zip
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            eslint-config-cherryplay/package-lock.json
            CherryPlayComponents/package-lock.json
            CherryPlayList/package-lock.json

      - name: Install shared ESLint config dependencies
        working-directory: eslint-config-cherryplay
        run: npm ci

      - name: Install and build CherryPlayComponents
        working-directory: CherryPlayComponents
        run: |
          npm ci
          npm run build

      - name: Install CherryPlayList dependencies
        working-directory: CherryPlayList
        run: npm ci

      - name: Stamp package version with PR number
        working-directory: CherryPlayList
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${PR_NUMBER}" ]; then
            echo "ERROR: pull_request.number is empty"
            exit 1
          fi
          BASE="$(node scripts/resolveDesktopReleaseVersion.mjs --latest-release)"
          VERSION="${BASE}-pr-${PR_NUMBER}"
          echo "Stamping CherryPlayList version to ${VERSION} (base ${BASE} from latest published Desktop release)"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE}" >> "$GITHUB_OUTPUT"
        id: stamp-version

      - name: Build Windows zip (no AIMP staging)
        working-directory: CherryPlayList
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:ci

      - name: Locate Windows zip
        id: locate-zip
        working-directory: CherryPlayList
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.stamp-version.outputs.app_version }}
          BASE_VERSION: ${{ steps.stamp-version.outputs.base_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          shopt -s nullglob
          expected="release/CherryPlayList-${EXPECTED_VERSION}-x64.zip"
          if [ ! -f "${expected}" ]; then
            echo "ERROR: Expected zip not found: ${expected}"
            ls -la release/ || true
            exit 1
          fi
          ZIP="release/CherryPlayList-${BASE_VERSION}-pr-${PR_NUMBER}-x64.zip"
          mv "${expected}" "${ZIP}"
          ZIP_NAME="$(basename "${ZIP}")"
          ARTIFACT_NAME="${ZIP_NAME%.zip}"
          echo "Found ${ZIP}"
          echo "zip_path=CherryPlayList/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate-zip.outputs.artifact_name }}
          path: ${{ steps.locate-zip.outputs.zip_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Comment download link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const zipName = '${{ steps.locate-zip.outputs.zip_name }}';
            const artifactName = '${{ steps.locate-zip.outputs.artifact_name }}';
            const appVersion = '${{ steps.stamp-version.outputs.app_version }}';
            const marker = '<!-- cherryplaylist-desktop-pr-artifact -->';
            const body = [
              marker,
              '## Desktop build ready for testing',
              '',
              `App package version **\`${appVersion}\`**; ZIP filename **\`${zipName}\`**; Actions artifact **\`${artifactName}\`**.`,
              '',
              `1. Open the [workflow run](${runUrl})`,
              '2. Scroll to **Artifacts**',
              `3. Download **${artifactName}**`,
              '',
              '_Retention: 14 days. Version is `{app}-pr-{PR}` (not a release). Prod releases keep plain app version only._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
