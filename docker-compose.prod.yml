services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cherryplay-postgres
    environment:
      POSTGRES_DB: cherryplay
      POSTGRES_USER: cherryplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cherryplay_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherryplay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cherryplay-network
    restart: unless-stopped

  # pgAdmin - Web interface for PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cherryplay-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cherryplay.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cherryplay-network
    restart: unless-stopped

  # Backend Server (.NET)
  server:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME_SERVER:-owner/repo/server}:${VERSION:-latest}
    container_name: cherryplay-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cherryplay;Username=cherryplay;Password=${POSTGRES_PASSWORD:-cherryplay_password}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_0:-http://cherrypashkaparty.ru}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_1:-http://www.cherrypashkaparty.ru}
      - Cors__AllowedOrigins__2=${CORS_ORIGIN_2:-http://web:80}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cherryplay-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Web Application
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME_WEB:-owner/repo/web}:${VERSION:-latest}
    container_name: cherryplay-web
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - cherryplay-network
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://cherrypashkaparty.ru:5000/api}
      - VITE_SIGNALR_URL=${VITE_SIGNALR_URL:-http://cherrypashkaparty.ru:5000/partyHub}
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  cherryplay-network:
    driver: bridge
